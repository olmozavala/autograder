# LLM settings (official API strings from https://developers.openai.com/api/docs/models)
# --- GPT-5 series (most capable) ---
#   "gpt-5.4"          – Most capable, current flagship
#   "gpt-5.4-pro"      – Smarter/more precise version of gpt-5.4
#   "gpt-5.3"          – Previous frontier model
#   "gpt-5-mini"       – Faster, cost-efficient GPT-5
#   "gpt-5-nano"       – Fastest, cheapest GPT-5
# --- GPT-4 series (solid & widely available) ---
#   "gpt-4.1"          – Smartest non-reasoning model (good for structured output)
#   "gpt-4.1-mini"     – Smaller, faster GPT-4.1
#   "gpt-4.1-nano"     – Fastest, cheapest GPT-4.1
# --- Reasoning models ---
#   "o4-mini"          – Fast, cost-efficient reasoning
#   "o3"               – Complex reasoning tasks
llm_model: "gpt-5-nano"
# Max tokens the LLM can generate per response. Increase if feedback gets cut off.
# For reasoning models (gpt-5), 16384+ is recommended to cover internal reasoning + output.
max_tokens: 16384